<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>privIsee — share your location privately</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <img src="img/logo.svg" alt="" class="logo" width="40" height="40" />
      <h1>privIsee</h1>
    </div>
    <p class="tagline">Share your live location — end-to-end encrypted. We never see where you are.</p>
    <p id="status" class="status"></p>

    <section id="start-section" class="card">
      <form id="start-form">
        <label for="duration">How long should you be locatable?</label>
        <div class="duration-row">
          <input type="number" id="duration" min="1" value="30" required />
          <select id="duration-unit">
            <option value="minutes" selected>Minutes</option>
            <option value="hours">Hours</option>
          </select>
        </div>
        <button type="submit" class="primary">Start sharing</button>
      </form>
    </section>

    <section id="active-section" class="card" hidden>
      <label>Share this link</label>
      <div class="share-url-row">
        <input id="share-url" type="text" readonly />
        <button id="copy-btn" type="button">Copy</button>
      </div>
      <p class="meta">Sharing ends: <span id="expires-at"></span></p>
      <button id="stop-btn" type="button" class="danger">Stop sharing</button>
    </section>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
