services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-privisee}
      MYSQL_USER: ${MYSQL_USER:-privisee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-privisee}
      DB_USER: ${MYSQL_USER:-privisee}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "8080:8080"

  housekeeping:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-privisee}
      DB_USER: ${MYSQL_USER:-privisee}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if php bin/housekeeping.php; then
            sleep 3600
          else
            echo "housekeeping run failed, retrying in 15s"
            sleep 15
          fi
        done

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"

volumes:
  mysql-data:
